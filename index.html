<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/equilateral.svg" as="image">
    <link rel="preload" href="/square.svg" as="image">
    <link rel="preload" href="/capture.svg" as="image">
    <link rel="preload" href="/info.svg" as="image">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>Kaleidoscope</title>
    <script>
      // Block camera access for this app (runs before any other script, including cached bundles)
      (function() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        var realGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = function() {
          return Promise.reject(new DOMException('Camera is disabled for this app', 'NotAllowedError'));
        };
      })();
    </script>
  </head>
  <body>
    <div id="app" class="relative"></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript>
      <p>Kaleidoscope is an interactive app and requires JavaScript to function.</p>
    </noscript>
  </body>
</html>
